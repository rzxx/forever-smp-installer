notes_en = "Text fields now support selection, copy and paste, undo and redo, and standard keyboard shortcuts. Paste the game folder path or choose it with Browse. Folder checks and update reviews run in the background, keeping the window responsive. Opening optional-mod choices no longer rescans every JAR. Buttons have clearer hover and keyboard-focus feedback."
notes_ru = "Поля ввода теперь поддерживают выделение, копирование и вставку, отмену и повтор действий, а также привычные сочетания клавиш. Путь к папке игры можно вставить или выбрать через «Обзор». Проверка папки и подготовка изменений выполняются в фоне, поэтому окно остаётся отзывчивым. При открытии выбора необязательных модов больше не проверяется заново каждый JAR-файл. Кнопки заметнее реагируют на наведение и фокус с клавиатуры."
