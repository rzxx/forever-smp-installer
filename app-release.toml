notes_en = "The nickname field now shows a visible caret and clear focus and hover feedback. Clicking outside leaves the field, making it easier to enter your exact player name. Installer source is now available in this repository, with local development, tests and release builds. The Minecraft pack is unchanged."
notes_ru = "В поле ника теперь видны текстовый курсор, подсветка фокуса и реакция на наведение. Нажатие вне поля снимает фокус, поэтому вводить точный ник игрока стало удобнее. Исходники приложения теперь доступны в этом репозитории; разработка, проверки и сборка выпусков выполняются локально. Сборка Minecraft не изменилась."
