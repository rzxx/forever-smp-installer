[workspace]
members = ["app/core", "app/desktop", "app/release"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.12"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
toml = "0.9"

[profile.release]
strip = true
lto = "thin"
