name: Check installer
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test, lint and rehearse executable handoff
        shell: pwsh
        run: ./scripts/test.ps1 -Handoff
